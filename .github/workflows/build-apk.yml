name: Build APK - التقويم الشامل 1.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: npm install

      - name: Add Android
        run: npx cap add android || echo "exists"

      - name: Sync
        run: npx cap sync android

      - name: Copy Icons
        run: |
          echo "Copying icons..."
          mkdir -p res-icons/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            if [ -f res-icons/$d/ic_launcher.png ]; then
              cp res-icons/$d/ic_launcher.png android/app/src/main/res/$d/ic_launcher.png
              cp res-icons/$d/ic_launcher_round.png android/app/src/main/res/$d/ic_launcher_round.png
            fi
          done
          ls android/app/src/main/res/mipmap-*/

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taqweem-Shamel-1.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
