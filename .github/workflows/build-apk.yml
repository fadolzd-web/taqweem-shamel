name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install deps
        run: |
          if [ -f package.json ]; then npm install; else npm init -y; npm install @capacitor/core @capacitor/cli @capacitor/android; fi
      - name: Setup Android
        run: |
          npx cap add android || true
          npx cap sync android || npx cap copy android
          ICON="ic_launcher.png"
          if [ -f "$ICON" ]; then
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p android/app/src/main/res/mipmap-$d
              cp $ICON android/app/src/main/res/mipmap-$d/ic_launcher.png
              cp $ICON android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            done
          fi
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taqweem-Shamel-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
