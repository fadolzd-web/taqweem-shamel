name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps

      - name: Add Android
        run: npx @capacitor/cli add android || true

      - name: Sync
        run: npx @capacitor/cli copy android

      - name: Copy icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Taqweem-APK
          path: android/app/build/outputs/apk/debug/*.apk          name: Taqweem-Shamel-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
