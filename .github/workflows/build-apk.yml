name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps

      - name: Add android platform
        run: npx cap add android || true

      - name: Copy web to android
        run: npx cap copy android

      - name: FIX SCREEN
        run: |
          cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowFullscreen">false</item>
                  <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="AppTheme">
              </style>
          </resources>
          EOF

      - name: FIX ICON
        run: |
          rm -f android/app/src/main/res/mipmap-*/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_round.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_foreground.xml
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            cp ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taqweem-APK-Fixed
          path: android/app/build/outputs/apk/debug/app-debug.apk
