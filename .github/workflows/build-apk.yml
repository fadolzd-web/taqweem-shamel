name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android || true
      - run: npx cap sync
      - run: |
          cp ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Taqweem-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taqweem-Shamel-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
